CONFIG_ADC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_LIBIIO_IIO_DEVICE=y
CONFIG_LIBIIO_IIO_DEVICE_ADC=y

# ADC streaming (RTIO/Q31 path) disabled: its decoder emits constant
# 0x0000/0xffff and leaves adc_stream() running, which wedges single-shot
# raw/process reads afterwards. readbuf falls back to direct adc_read_dt.
# CONFIG_ADC_STREAM=y
# CONFIG_ADC_MAX32_STREAM=y

# CONFIG_LOG=y
# CONFIG_LIBIIO_LOG_LEVEL_DBG=y